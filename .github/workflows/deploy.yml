name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Decrypt content archive
        run: npm run decrypt
        env:
          VITE_CASE_STUDY_PASSWORD: ${{ secrets.CASE_STUDY_PASSWORD }}

      - run: npm run build:production
        env:
          VITE_CASE_STUDY_PASSWORD: ${{ secrets.CASE_STUDY_PASSWORD }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
